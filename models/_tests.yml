version: 2

models:
  - name: stg_communes
    description: "Référentiel des communes nettoyé et dédoublonné"
    columns:
      - name: code_insee
        description: "Code INSEE sur 5 caractères (zéros à gauche, format corse 2A/2B conservé)"
        tests:
          - not_null
          - unique
      - name: ville
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: stg_open_meteo
    description: "Données ERA5 enrichies via dim_commune"
    columns:
      - name: code_insee
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: temperature_moyenne
        tests:
          - not_null
      - name: ville
        tests:
          - not_null

  - name: dim_commune
    description: "Dimension commune"
    columns:
      - name: code_insee
        tests:
          - not_null
          - unique
      - name: ville
        tests:
          - not_null

  - name: dim_date
    description: "Dimension calendaire"
    columns:
      - name: date
        tests:
          - not_null
          - unique
      - name: annee
        tests:
          - not_null
      - name: mois
        tests:
          - not_null

  - name: fct_daily_heat_weather
    description: "Table de faits météo journalière"
    columns:
      - name: code_insee
        tests:
          - not_null
      - name: date
        tests:
          - not_null

  - name: stg_odisse_canicule
    description: "Données sanitaires Odissé - canicule"
    columns:
      - name: annee
        tests:
          - not_null