name: Daily Data Extraction & dbt Pipeline

on:
  schedule:
    # Exécute tous les jours à 1h du matin (Paris timezone = UTC+2 en été, UTC+1 en hiver)
    - cron: '0 1 * * *'
  workflow_dispatch:  # Permet de lancer manuellement

env:
  GCP_PROJECT: newfourcasters
  TZ: Europe/Paris

jobs:
  extract_and_transform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-auth requests python-dotenv
          
      - name: Create .env file
        run: |
          cat > .env << EOF
          GCP_PROJECT=${{ env.GCP_PROJECT }}
          GCP_KEY_PATH=/tmp/gcp-key.json
          OPEN_METEO_BASE_URL=https://archive-api.open-meteo.com/v1/archive
          MAX_RETRIES=4
          BATCH_SIZE=10
          EOF
          
      - name: Set up GCP credentials
        run: |
          cat > /tmp/gcp-key.json << 'EOF'
          ${{ secrets.GCP_CREDENTIALS }}
          EOF
          chmod 600 /tmp/gcp-key.json
          
      - name: Run data extraction pipeline
        run: |
          echo "📊 Starting data extraction pipeline..."
          python3 scripts/extract_data.py
          
      - name: Set up dbt
        run: |
          pip install dbt-bigquery==1.12.0
          
      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          lesfourcasters_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: ${{ env.GCP_PROJECT }}
                keyfile: /tmp/gcp-key.json
                dataset: lesfourcasters_dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                retries: 1
          EOF
          
      - name: Run dbt pipeline
        run: |
          echo "🔄 Starting dbt pipeline..."
          cd ${{ github.workspace }}
          dbt run --full-refresh
          dbt test
          
      - name: Generate dbt documentation
        if: always()
        run: |
          dbt docs generate
          
      - name: Success notification
        if: success()
        run: |
          echo "================================"
          echo "✅ DAILY PIPELINE SUCCESS!"
          echo "================================"
          echo "✓ Data extraction complete"
          echo "✓ dbt transformations complete"
          echo "✓ Data quality tests passed"
          
      - name: Failure notification
        if: failure()
        run: |
          echo "================================"
          echo "❌ DAILY PIPELINE FAILED!"
          echo "================================"
          exit 1