name: Daily Data Extraction & dbt Pipeline

on:
  schedule:
    # Tous les jours à 1h du matin (heure de Paris)
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  GCP_PROJECT: newfourcasters
  TZ: Europe/Paris

jobs:
  extract_and_transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-auth requests python-dotenv
          pip install dbt-bigquery==1.12.0

      - name: Set up GCP credentials
        run: |
          python3 << 'PYTHON_EOF'
          import json, base64

          secret = '''${{ secrets.GCP_CREDENTIALS }}'''

          try:
              decoded = base64.b64decode(secret).decode('utf-8')
              json.loads(decoded)
              secret = decoded
              print("Secret decode depuis base64")
          except Exception:
              print("Secret utilise directement")

          with open('/tmp/gcp-key.json', 'w') as f:
              f.write(secret)

          try:
              data = json.loads(secret)
              print(f"Service Account: {data.get('client_email')}")
              print(f"Project: {data.get('project_id')}")
          except json.JSONDecodeError as e:
              print(f"ERREUR JSON: {e}")
              exit(1)
          PYTHON_EOF

          chmod 600 /tmp/gcp-key.json

      - name: Create .env file
        run: |
          cat > .env << EOF
          GCP_PROJECT=${{ env.GCP_PROJECT }}
          GCP_KEY_PATH=/tmp/gcp-key.json
          OPEN_METEO_BASE_URL=https://archive-api.open-meteo.com/v1/archive
          MAX_RETRIES=4
          BATCH_SIZE=10
          ERA5_LAG_DAYS=5
          ERA5_WINDOW_DAYS=10
          ERA5_DEDUP_LOOKBACK_DAYS=60
          EOF

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          lesfourcasters_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: newfourcasters
                keyfile: /tmp/gcp-key.json
                dataset: lesfourcasters_dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                retries: 1
          EOF

      - name: Run data extraction pipeline
        run: |
          echo "=== Extraction des donnees ==="
          python3 scripts/extract_data.py

      - name: Run dbt pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          echo "=== Transformations dbt ==="
          cd ${{ github.workspace }}
          dbt run
          dbt test

      - name: Generate dbt documentation
        if: success()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: dbt docs generate

      - name: Success notification
        if: success()
        run: |
          echo "================================"
          echo "PIPELINE QUOTIDIEN OK"
          echo "================================"

      - name: Failure notification
        if: failure()
        run: |
          echo "================================"
          echo "ECHEC DU PIPELINE QUOTIDIEN"
          echo "Consulter les logs ci-dessus"
          echo "================================"
          exit 1