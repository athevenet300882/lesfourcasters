name: Daily Pipeline - lesfourcasters

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-cloud-bigquery requests dbt-bigquery python-dotenv

      - name: Setup GCP credentials
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp-key.json
          echo "GCP_KEY_PATH=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > .env << EOF
          GCP_PROJECT=newfourcasters
          GCP_KEY_PATH=/tmp/gcp-key.json
          OPEN_METEO_BASE_URL=https://archive-api.open-meteo.com/v1/archive
          MAX_RETRIES=4
          BATCH_SIZE=10
          EOF

      - name: Extract Data (ERA5 + Odissé)
        run: python scripts/extract_data.py

      - name: Run dbt models
        run: |
          cd lesfourcasters_dbt
          dbt run --profiles-dir . --target ci

      - name: Run dbt tests
        run: |
          cd lesfourcasters_dbt
          dbt test --profiles-dir . --target ci

      - name: Cleanup
        if: always()
        run: rm -f /tmp/gcp-key.json .env