name: Daily Pipeline - lesfourcasters

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery pandas requests dbt-bigquery
      
      - name: Extract ERA5 Seamless data
        env:
          GCP_PROJECT_ID: newfourcasters
        run: |
          python scripts/extract_era5.py
      
      - name: Run dbt models
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp-key.json
          dbt run