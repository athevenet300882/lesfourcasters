name: Daily Pipeline - lesfourcasters

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-cloud-bigquery pandas requests dbt-bigquery

      - name: Setup GCP credentials
        run: echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp-key.json

      - name: Extract ERA5 Seamless data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: python scripts/extract_era5.py

      - name: Run dbt models
        run: dbt run --profiles-dir . --target ci